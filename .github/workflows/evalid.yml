name: Evalid

on:
  push:
    branches: [main]
    paths:
      - 'phanes/evalid/**'
      - '.github/workflows/evalid.yml'
  pull_request:
    paths:
      - 'phanes/evalid/**'
      - '.github/workflows/evalid.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: phanes/evalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: phanes/evalid/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
