name: project-automation

# Project 6 (surlymochan user project) automation for phanes.
# Requires repo secret PROJECT_TOKEN: classic PAT with repo + project scopes.

on:
  issues:
    types: [opened, reopened, labeled, assigned]
  workflow_dispatch:

permissions:
  issues: read

jobs:
  add-to-project:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to Project 6
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/surlymochan/projects/6
          github-token: ${{ secrets.PROJECT_TOKEN }}

  backfill:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Backfill open issues into Project 6
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const owner = 'surlymochan';
            const repo = 'phanes';
            const projectNumber = 6;

            const proj = (await github.graphql(
              `query($login:String!,$n:Int!){ user(login:$login){ projectV2(number:$n){ id fields(first:100){ nodes{
                 ... on ProjectV2Field { id name dataType }
                 ... on ProjectV2SingleSelectField { id name dataType options { id name } }
               } } } } }`,
              { login: owner, n: projectNumber })).user.projectV2;

            const fieldByName = (name) => proj.fields.nodes.find(f => f && f.name === name);
            const laneField = fieldByName('Lane');
            const assignerField = fieldByName('assigner');

            const issues = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100 })).filter(i => !i.pull_request);

            let added = 0, laneSet = 0, assignerSet = 0, skipped = [];
            for (const issue of issues) {
              const itemId = (await github.graphql(
                `mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item { id } } }`,
                { p: proj.id, c: issue.node_id })).addProjectV2ItemById.item.id;
              added++;

              const lane = issue.labels.map(l => l.name).find(n => n.startsWith('backend:'));
              if (laneField && lane && laneField.dataType === 'SINGLE_SELECT') {
                const opt = laneField.options.find(o => o.name === lane.slice('backend:'.length));
                if (opt) {
                  await github.graphql(
                    `mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){ updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){ projectV2Item { id } } }`,
                    { p: proj.id, i: itemId, f: laneField.id, o: opt.id });
                  laneSet++;
                } else {
                  skipped.push(`#${issue.number} lane ${lane}`);
                }
              }

              const assignee = (issue.assignees && issue.assignees[0] && issue.assignees[0].login) || '';
              if (assignerField && assignee) {
                await github.graphql(
                  `mutation($p:ID!,$i:ID!,$f:ID!,$v:String!){ updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{text:$v}}){ projectV2Item { id } } }`,
                  { p: proj.id, i: itemId, f: assignerField.id, v: assignee });
                assignerSet++;
              }
            }
            core.summary.addRaw(`Added ${added} issues. Lane set ${laneSet}, assigner set ${assignerSet}. Skipped: ${skipped.join(', ') || 'none'}`).write();
