name: Phanes components
on:
  push:
    branches: [main, codex/phanes-unification]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-24.04
    outputs:
      openswarm: ${{ steps.detect.outputs.openswarm }}
      openbot: ${{ steps.detect.outputs.openbot }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "openswarm=true" >> "$GITHUB_OUTPUT"
            echo "openbot=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          openswarm=false
          openbot=false
          while IFS= read -r path; do
            case "$path" in
              openswarm/*|.github/*) openswarm=true ;;
            esac
            case "$path" in
              openbot/*|.github/*) openbot=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...HEAD")
          echo "openswarm=$openswarm" >> "$GITHUB_OUTPUT"
          echo "openbot=$openbot" >> "$GITHUB_OUTPUT"
  example-json:
    name: Validate example JSON
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Parse example JSON files
        run: |
          while IFS= read -r -d '' file; do
            if ! python3 -m json.tool "$file" >/dev/null; then
              echo "Invalid JSON: $file" >&2
              exit 1
            fi
          done < <(find openswarm/examples openbot/examples -name '*.json' -not -path '*/node_modules/*' -print0)
  openswarm:
    name: OpenSwarm tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.openswarm == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    defaults:
      run:
        working-directory: openswarm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline CLI smoke test
        env:
          OPENSWARM_STATE_FILE: examples/demo-state.json
        run: |
          export OPENSWARM_HOME="$(mktemp -d)"
          python bin/openswarm status
          python bin/openswarm route --type impl --difficulty 3
  openbot:
    name: OpenBot type and language checks
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.openbot == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: openbot
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:node
      - run: bun run i18n:check
      - run: bun run build
  openbot-scenario-tests:
    name: OpenBot scenario tests (Python ${{ matrix.python }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.openbot == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check D1 migration numbers
        run: python openbot/apps/auth-api/scripts/check_migration_numbers.py openbot/apps/auth-api/migrations
      - name: Run scenario unit tests
        run: |
          find openbot/examples/org-health-local -type f -name 'test_*.py' -print0 |
            while IFS= read -r -d '' test_file; do
              test_dir="$(dirname "$test_file")"
              test_name="$(basename "$test_file" .py)"
              (cd "$test_dir" && python -m unittest "$test_name" -v)
            done
      - name: Validate scenario data
        run: python openbot/examples/org-health-local/validate.py
