name: Phanes components
on:
  push:
    branches: [main, codex/phanes-unification]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-24.04
    outputs:
      swrm: ${{ steps.detect.outputs.swrm }}
      volto: ${{ steps.detect.outputs.volto }}
      scenario: ${{ steps.detect.outputs.scenario }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "swrm=true" >> "$GITHUB_OUTPUT"
            echo "volto=true" >> "$GITHUB_OUTPUT"
            echo "scenario=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          swrm=false
          volto=false
          scenario=false
          while IFS= read -r path; do
            case "$path" in
              swrm/*|openswarm/*|tools/lane-autodispatch/*|tools/tests/*|tools/ci-swrm.*|docs/fleet-topology-expected.md|docs/dual-mode-ssh.md|docs/examples/hub-bridge.env.example|.github/*) swrm=true ;;
            esac
            case "$path" in
              volto/*|.github/*) volto=true ;;
            esac
            case "$path" in
              examples/org-health-local/*|.github/*) scenario=true ;;
            esac
          # --no-renames: git reports only the target path of a rename, so a file
          # moved out of swrm/, tools/lane-autodispatch/ or tools/tests/ would
          # otherwise slip past the path based test selection of the Swrm gate.
          done < <(git diff --name-only --no-renames "$BASE_SHA...HEAD")
          echo "swrm=$swrm" >> "$GITHUB_OUTPUT"
          echo "volto=$volto" >> "$GITHUB_OUTPUT"
          echo "scenario=$scenario" >> "$GITHUB_OUTPUT"
  example-json:
    name: Validate example JSON
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Parse example JSON files
        run: |
          while IFS= read -r -d '' file; do
            if ! python3 -m json.tool "$file" >/dev/null; then
              echo "Invalid JSON: $file" >&2
              exit 1
            fi
          done < <(find swrm/examples examples -name '*.json' -not -path '*/node_modules/*' -print0)
  # Advisory only (Nick: CI gates on Linux tests, no heavy gates). An unmarked PR title is a bookkeeping
  # issue for upstream sync, not a broken build: report it as a warning, never fail the check or block merge.
  upstream-drift:
    name: Check upstream drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR drift marking
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          python3 tools/upstream_drift.py --fail-on-unmarked || {
            echo "::warning title=upstream drift (advisory)::PR touches generic swrm/volto paths without 'upstream' in the title; add an upstream(<component>): prefix when convenient. Not a merge gate."
            exit 1
          }
      - name: Write drift report to job summary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          status=0
          output="$(python3 tools/upstream_drift.py --json)" || status=$?
          printf '## Upstream drift\n\n```json\n%s\n```\n' "$output" >> "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] || echo "upstream_drift.py exited with $status (advisory, not a gate)" >> "$GITHUB_STEP_SUMMARY"
  swrm:
    name: Swrm tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.swrm == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Swrm gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tools/ci-swrm.sh
  volto:
    name: Volto type and language checks
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.volto == 'true' || needs.changes.outputs.scenario == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: volto
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:node
        if: github.event_name != 'pull_request' || needs.changes.outputs.volto == 'true'
      - run: bun run i18n:check --example-root ../examples/org-health-local
      - run: bun scripts/i18n-check-e2e.ts --example-root ../examples/org-health-local
      - run: bun run build
        if: github.event_name != 'pull_request' || needs.changes.outputs.volto == 'true'
  volto-scenario-tests:
    name: Volto scenario tests (Python ${{ matrix.python }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.volto == 'true' || needs.changes.outputs.scenario == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check D1 migration numbers
        run: python volto/apps/auth-api/scripts/check_migration_numbers.py volto/apps/auth-api/migrations
      - name: Run scenario unit tests
        run: |
          find examples/org-health-local -type f -name 'test_*.py' -print0 |
            while IFS= read -r -d '' test_file; do
              test_dir="$(dirname "$test_file")"
              test_name="$(basename "$test_file" .py)"
              (cd "$test_dir" && python -m unittest "$test_name" -v)
            done
      - name: Validate scenario data
        run: python examples/org-health-local/validate.py
