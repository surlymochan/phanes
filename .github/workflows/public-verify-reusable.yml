name: public-verify-reusable

on:
  workflow_call:
    inputs:
      scanner_ref:
        description: Immutable commit SHA containing the scanner
        required: false
        type: string
    secrets:
      PUBLIC_VERIFY_DENYLIST:
        required: false

permissions:
  contents: read

jobs:
  denylist-config:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.config.outputs.configured }}
    steps:
      - name: Checkout configuration detector at fixed revision
        uses: actions/checkout@v4
        with:
          repository: surlymochan/phanes
          ref: ${{ inputs.scanner_ref || github.sha }}
          path: .public-verify-scanner
          persist-credentials: false
      - name: Check denylist configuration
        id: config
        env:
          PUBLIC_VERIFY_DENYLIST: ${{ secrets.PUBLIC_VERIFY_DENYLIST }}
        run: python3 .public-verify-scanner/tools/ci/public_verify_config.py
  public-verify:
    needs: denylist-config
    if: needs.denylist-config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout event revision and full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout scanner at fixed revision
        uses: actions/checkout@v4
        with:
          repository: surlymochan/phanes
          ref: ${{ inputs.scanner_ref || github.sha }}
          path: .public-verify-scanner
          persist-credentials: false
      - name: Scan changes and public text
        env:
          PUBLIC_VERIFY_DENYLIST: ${{ secrets.PUBLIC_VERIFY_DENYLIST }}
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PUBLIC_VERIFY_DENYLIST" ]]; then
            echo 'public-verify: missing denylist' >&2
            exit 2
          fi
          if [[ "$BASE" =~ ^0+$ ]]; then
            BASE="$(git hash-object -w -t tree /dev/null)"
          fi
          # checkout fetches the PR merge ref, including both parents for fork PRs.
          git cat-file -e "${BASE}^{object}"
          git cat-file -e "${HEAD}^{commit}"
          python3 .public-verify-scanner/tools/ci/public_verify.py diff --base "$BASE" --head "$HEAD"
          python3 .public-verify-scanner/tools/ci/public_verify.py commits --base "$BASE" --head "$HEAD"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            printf '%s' "$PR_TITLE" | python3 .public-verify-scanner/tools/ci/public_verify.py text --label pr-title
            printf '%s' "$PR_BODY" | python3 .public-verify-scanner/tools/ci/public_verify.py text --label pr-body
          fi
