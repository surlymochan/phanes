# Kernel limits for the OpenBot instances. `openbot-instance setup` installs it as
# /etc/sysctl.d/90-openbot-docker.conf. See docs/docker.md#several-instances-on-one-host.
#
# Chromium, provider tools and agents watch files with inotify. With userns-remap, all containers run
# as the same host user, so all instances share these per-user limits.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 4194304
