# The container logs of the OpenBot instances. `openbot-instance setup` installs it as
# /etc/rsyslog.d/30-openbot-docker.conf. See docs/docker.md#several-instances-on-one-host.
#
# Docker sends them to this socket and not to /dev/log, so they stay out of the journal and
# /var/log/syslog, whose size limits other services share. The AppArmor profile of rsyslogd permits a
# socket at /var/lib/*/dev/log. openbot-logrotate keeps the files for 30 days.
template(name="OpenbotDockerFile" type="string" string="/var/log/openbot/%programname%.log")
template(name="OpenbotDockerLine" type="string" string="%timegenerated:::date-rfc3339% %msg:2:$%\n")

ruleset(name="openbot-docker") {
  # The tag is the container name, which openbot-instance gives.
  if $programname startswith "openbot-" then {
    # setup makes /var/log/openbot for syslog, the user of rsyslogd.
    action(type="omfile" dynaFile="OpenbotDockerFile" template="OpenbotDockerLine" fileCreateMode="0640")
  }
  stop
}

input(type="imuxsock" socket="/var/lib/openbot-docker/dev/log" ruleset="openbot-docker" createPath="off")
