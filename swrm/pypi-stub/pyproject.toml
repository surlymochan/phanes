[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swrm"
version = "0.0.1"
description = "swrm — a distributed dispatcher for heterogeneous agent fleets. Name reserved; canonical distribution forthcoming."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.hatch.build.targets.wheel]
packages = ["swrm"]
