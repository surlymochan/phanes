name: CLA

# Checks that each author of a pull request signed CLA.md. The rules are in `scripts/cla.ts`. The
# signatures are recorded in `signatures.json` on the `cla-signatures` branch.
#
# `pull_request_target` and `issue_comment` give a fork's pull request a token that can comment, set a
# status and write the record. It is safe here because no step checks out or runs the pull request's
# code: the job checks out the default branch and reads the pull request only through the API.
on:
  pull_request_target:
    # `edited`: the author ticks the agreement box in the description.
    types: [opened, reopened, synchronize, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Not "CLA": that is the name of the commit status that the script sets.
    name: Check CLA signatures
    # A comment starts a run only on a pull request, and only when it can contain a signature.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'Contributor Assignment Agreement'))
    concurrency:
      group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Check the signatures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: bun scripts/cla.ts pr "$PR_NUMBER"
